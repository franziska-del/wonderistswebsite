media:
  input: public/assets
  output: /assets

content:
  - name: website-copy
    label: Website copy
    type: group
    items:
      - name: home
        label: Main page
        type: file
        path: src/content/home.json
        format: json
        fields:
          - name: meta
            label: Search and browser details
            type: object
            fields:
              - { name: title, label: Browser title, type: string }
              - { name: description, label: Search description, type: text }
          - name: navigation
            label: Navigation
            type: object
            fields:
              - { name: adventures, label: Adventures label, type: string }
              - { name: wondercards, label: Wondercards label, type: string }
              - { name: philosophy, label: Philosophy label, type: string }
              - { name: contact, label: Contact label, type: string }
          - name: hero
            label: Hero
            type: object
            fields:
              - { name: title, label: Heading, type: text, description: Use a new line to control the line break. }
              - name: body
                label: Paragraphs
                type: text
                list: true
              - { name: primaryCta, label: Primary button, type: string }
              - { name: secondaryCta, label: Secondary button, type: string }
              - { name: image, label: Image, type: image }
              - { name: imageAlt, label: Image description, type: string }
              - { name: caption, label: Image caption, type: string }
          - name: manifesto
            label: Manifesto
            type: object
            fields:
              - { name: texture, label: Side text, type: string }
              - { name: title, label: Heading, type: text }
              - name: body
                label: Paragraphs
                type: text
                list: true
              - { name: statement, label: Closing statement, type: string }
              - { name: statementStrong, label: Emphasised statement, type: string }
          - name: adventures
            label: Adventures
            type: object
            fields:
              - { name: title, label: Section heading, type: text }
              - { name: intro, label: Introduction, type: text }
              - name: items
                label: Adventure cards
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: id, label: ID, type: string, readonly: true }
                  - { name: number, label: Number, type: string }
                  - { name: title, label: Title, type: string }
                  - { name: cta, label: Button label, type: string }
                  - { name: href, label: Page link, type: string, required: false }
                  - { name: image, label: Image, type: image }
                  - { name: description, label: Description, type: text }
          - name: adventureStory
            label: Adventure story
            type: object
            fields:
              - { name: title, label: Heading, type: text }
              - name: body
                label: Paragraphs
                type: text
                list: true
          - name: wondercards
            label: Wondercards and Unspoken cards
            type: object
            fields:
              - { name: title, label: Heading, type: text }
              - name: body
                label: Paragraphs
                type: text
                list: true
              - { name: shipping, label: Shipping note, type: string }
              - { name: cta, label: Wondercards button, type: string }
              - { name: unspokenCta, label: Unspoken button, type: string }
              - { name: unspokenUrl, label: Unspoken deck URL, type: string }
              - { name: image, label: Image, type: image }
              - { name: imageAlt, label: Image description, type: string }
          - name: philosophy
            label: Philosophy
            type: object
            fields:
              - { name: title, label: Heading, type: text }
              - name: body
                label: Paragraphs
                type: text
                list: true
              - name: definitions
                label: Definitions
                type: object
                list: true
                fields:
                  - { name: term, label: Term, type: string }
                  - { name: definition, label: Definition, type: text }
          - name: closing
            label: Closing section
            type: object
            fields:
              - { name: title, label: Heading, type: text }
              - { name: body, label: Paragraph, type: text }
              - { name: statement, label: Emphasised statement, type: text }
              - { name: primaryCta, label: First button, type: string }
              - { name: secondaryCta, label: Second button, type: string }
          - name: contact
            label: Contact form
            type: object
            fields:
              - { name: defaultTitle, label: Default heading, type: string }
              - { name: defaultDescription, label: Default description, type: text }
              - { name: wondercardsTitle, label: Wondercards heading, type: string }
              - { name: wondercardsDescription, label: Wondercards description, type: text }
              - { name: formCta, label: Form button, type: string }
              - { name: success, label: Success message, type: text }
          - name: footer
            label: Footer
            type: object
            fields:
              - { name: instagramLabel, label: Instagram label, type: string }
              - { name: instagramUrl, label: Instagram URL, type: string, required: false }
              - { name: linkedinLabel, label: LinkedIn label, type: string }
              - { name: linkedinUrl, label: LinkedIn URL, type: string, required: false }

      - name: wild-ideas
        label: WILD IDEAS page
        type: file
        path: src/content/wild-ideas.json
        format: json
        fields:
          - name: meta
            label: Search and browser details
            type: object
            fields:
              - { name: title, label: Browser title, type: string }
              - { name: description, label: Search description, type: text }
          - name: navigation
            label: Navigation
            type: object
            fields:
              - { name: experience, label: Experience label, type: string }
              - { name: whyItWorks, label: Why it works label, type: string }
              - { name: hosts, label: Hosts label, type: string }
              - { name: book, label: Booking label, type: string }
          - name: hero
            label: Hero
            type: object
            fields:
              - { name: title, label: Heading, type: string }
              - { name: subtitle, label: Subtitle, type: text }
              - { name: dates, label: Dates, type: string }
              - { name: location, label: Location, type: string }
              - { name: attribution, label: Attribution, type: string }
              - { name: primaryCta, label: Primary button, type: string }
              - { name: secondaryCta, label: Secondary button, type: string }
              - { name: image, label: Image, type: image }
              - { name: imageAlt, label: Image description, type: string }
              - { name: caption, label: Image caption, type: string }
          - name: intro
            label: Introduction
            type: object
            fields:
              - { name: label, label: Section label, type: string }
              - { name: title, label: Heading, type: text }
              - name: body
                label: Paragraphs
                type: text
                list: true
              - { name: statement, label: Closing statement, type: text }
          - name: facts
            label: Experience facts
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: value, label: Value, type: string }
          - name: futureSkills
            label: Future skills
            type: object
            fields:
              - { name: label, label: Section label, type: string }
              - { name: title, label: Heading, type: text }
              - name: body
                label: Paragraphs
                type: text
                list: true
              - { name: image, label: Image, type: image }
              - { name: imageAlt, label: Image description, type: string }
              - { name: caption, label: Image caption, type: string }
          - name: experience
            label: Weekend experience
            type: object
            fields:
              - { name: label, label: Section label, type: string }
              - { name: title, label: Heading, type: text }
              - { name: intro, label: Introduction, type: text }
              - name: items
                label: Activities
                type: text
                list: true
              - { name: outro, label: Closing paragraph, type: text }
          - name: venture
            label: First venture
            type: object
            fields:
              - { name: label, label: Section label, type: string }
              - { name: title, label: Heading, type: text }
              - name: body
                label: Paragraphs
                type: text
                list: true
              - name: items
                label: Learning outcomes
                type: text
                list: true
              - { name: outro, label: Closing paragraph, type: text }
          - name: reasons
            label: Why WILD IDEAS works
            type: object
            fields:
              - { name: label, label: Section label, type: string }
              - { name: title, label: Heading, type: text }
              - name: items
                label: Reasons
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: title, label: Title, type: string }
                  - name: body
                    label: Paragraphs
                    type: text
                    list: true
          - name: inclusions
            label: What’s included
            type: object
            fields:
              - { name: label, label: Section label, type: string }
              - { name: title, label: Heading, type: text }
              - name: items
                label: Inclusions
                type: text
                list: true
              - { name: suitability, label: Age suitability, type: string }
          - name: hosts
            label: Hosts
            type: object
            fields:
              - { name: label, label: Section label, type: string }
              - { name: title, label: Heading, type: text }
              - name: items
                label: Host profiles
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{name}"
                fields:
                  - { name: name, label: Name, type: string }
                  - name: body
                    label: Paragraphs
                    type: text
                    list: true
          - name: audience
            label: Who it’s for
            type: object
            fields:
              - { name: label, label: Section label, type: string }
              - { name: title, label: Heading, type: string }
              - { name: intro, label: Introduction, type: text }
              - name: items
                label: Parent goals
                type: text
                list: true
              - { name: outro, label: Closing paragraph, type: text }
          - name: closing
            label: Closing story
            type: object
            fields:
              - { name: label, label: Section label, type: string }
              - { name: title, label: Heading, type: text }
              - name: body
                label: Paragraphs
                type: text
                list: true
              - { name: cta, label: Button label, type: string }
          - name: booking
            label: Booking section
            type: object
            fields:
              - { name: label, label: Section label, type: string }
              - { name: title, label: Heading, type: text }
              - { name: dates, label: Dates, type: string }
              - { name: location, label: Location, type: string }
              - { name: price, label: Price, type: string }
              - { name: includes, label: Included summary, type: text }
              - { name: capacity, label: Capacity, type: string }
              - { name: formCta, label: Form button, type: string }
              - { name: success, label: Success message, type: text }
